<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Clinical Notes App</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1976d2;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-label {
      font-weight: 500;
      color: #444;
    }

    .btn-primary {
      background: #1976d2;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 10px;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      background: #1565c0;
      transform: translateY(-2px);
    }

    .input-group-text {
      background: #f8f9fa;
      border-right: none;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
    }

    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 0.25rem rgba(25, 118, 210, 0.25);
    }

    .text-muted a {
      color: #1976d2;
      text-decoration: none;
    }

    .text-muted a:hover {
      text-decoration: underline;
    }

    .alert {
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <i class="bi bi-heart-pulse-fill me-2"></i> Clinical Notes
    </div>

    <h4 class="text-center mb-4 text-secondary">Sign In</h4>

    <!-- Error message area -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
      </div>

      <div class="d-grid mb-4">
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
          <span id="loginText">Login</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </div>

      <div class="text-center text-muted small">
        <a href="#">Forgot password?</a> • <a href="#">Contact support</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Login logic -->
  <script>
    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginSpinner = document.getElementById('loginSpinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter both username and password');
        return;
      }

      // Show loading state
      loginBtn.disabled = true;
      loginText.classList.add('d-none');
      loginSpinner.classList.remove('d-none');
      errorAlert.classList.add('d-none');

      try {
        const response = await fetch('/clininote/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Success - store user info (you can add token later)
        localStorage.setItem('user', JSON.stringify({
          userId: data.userId,
          username: data.username,
          fullName: data.fullName,
          role: data.role
        }));
        
        // After successful login response
        localStorage.setItem('authToken', 'logged-in');  // or better: store the actual token/userId/role later
        localStorage.setItem('user', JSON.stringify(data));  // store user info

        // Redirect to main app
        window.location.href = 'index.html';

      } catch (err) {
        showError(err.message);
      } finally {
        loginBtn.disabled = false;
        loginText.classList.remove('d-none');
        loginSpinner.classList.add('d-none');
      }
    });

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.classList.remove('d-none');
    }
  </script>
</body>
</html>
